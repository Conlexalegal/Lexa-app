<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:linear-gradient(180deg,#4A0D14 0%,#380B10 55%,#2A0C0A 100%);font-family:'DM Sans',sans-serif;color:#F1E2D0;position:relative}
#cap{position:absolute;left:70px;right:70px;top:220px;height:230px;display:flex;align-items:center;justify-content:center;text-align:center}
#cap p{font-family:'Playfair Display',serif;font-weight:700;font-size:64px;line-height:1.12;letter-spacing:-.5px}
#cap em{font-style:italic;font-weight:600;color:#E0B07A}
#phone{position:absolute;left:130px;top:490px;width:820px;height:1340px;border-radius:52px;overflow:hidden;border:4px solid #B5694A;box-shadow:0 30px 80px rgba(0,0,0,.55);background:#380B10}
#app{width:402px;height:660px;border:0;transform:scale(2.0199);transform-origin:0 0;position:absolute;left:0;top:0}
#her{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#tap{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(241,226,208,.35);border:4px solid rgba(241,226,208,.85);display:none;pointer-events:none;z-index:9}
#logo{position:absolute;left:50%;top:92px;transform:translateX(-50%);height:70px;opacity:.9}
.full{position:absolute;left:0;right:0;top:490px;height:1340px;display:none}
/* Escena 1: tres tarjetas */
.cards{display:flex;flex-direction:column;align-items:center;gap:46px;padding-top:70px}
.card{width:700px;height:250px;border-radius:36px;background:#F1E2D0;color:#3A0A12;display:flex;align-items:center;gap:40px;padding:0 60px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.card .l{width:120px;height:120px;border-radius:50%;background:#B5694A;color:#F1E2D0;font:700 66px 'Playfair Display',serif;display:flex;align-items:center;justify-content:center}
.card .t{font:700 60px 'Playfair Display',serif}
.card .q{margin-left:auto;font:700 90px 'Playfair Display',serif;color:#B5694A}
/* Escena 5: caminos */
#s5 svg{position:absolute;left:0;top:0}
/* Escena 7 */
#s7 .box{position:absolute;left:110px;right:110px;top:140px;bottom:220px;border-radius:44px;border:4px solid #B5694A;background:rgba(25,6,6,.35);display:flex;flex-direction:column;justify-content:center;padding:70px}
#s7 .k{font:700 34px 'DM Sans',sans-serif;letter-spacing:6px;color:#E0B07A;text-transform:uppercase}
#s7 .line{width:120px;height:8px;background:#B5694A;border-radius:4px;margin:34px 0}
#s7 p{font:500 44px/1.4 'DM Sans',sans-serif}
#s7 .cta{margin-top:60px;display:inline-block;background:#D9904F;color:#3A0A12;font:700 46px 'DM Sans',sans-serif;padding:28px 44px;border-radius:999px;align-self:flex-start}
</style></head><body>
<img id="logo" src="logo_crema.png" alt="">
<div id="cap"><p id="capt"></p></div>
<div id="phone"><iframe id="app" src="http://localhost:8765/index.html"></iframe><img id="her" alt=""></div>
<div id="tap"></div>

<div class="full" id="s1"><div class="cards">
  <div class="card" data-i="0"><div class="l">A</div><div class="t">Opción A</div><div class="q">?</div></div>
  <div class="card" data-i="1"><div class="l">B</div><div class="t">Opción B</div><div class="q">?</div></div>
  <div class="card" data-i="2"><div class="l">C</div><div class="t">Opción C</div><div class="q">?</div></div>
</div></div>

<div class="full" id="s5"><svg width="1080" height="1340" viewBox="0 0 1080 1340">
  <defs><marker id="ar" viewBox="0 0 8 8" markerWidth="2.4" markerHeight="2.4" refX="2" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#E0B07A"/></marker></defs>
  <g font-family="Playfair Display, serif" font-weight="700" font-size="54" fill="#F1E2D0">
    <text x="90" y="250">A</text><text x="90" y="590">B</text><text x="90" y="930">C</text>
  </g>
  <path id="p1" d="M170 232 L940 232" stroke="#E0B07A" stroke-width="22" stroke-linecap="round" fill="none" marker-end="url(#ar)"/>
  <path id="p2" d="M170 572 L640 572" stroke="#D9904F" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path id="p3" d="M170 912 L360 912" stroke="#A33A2C" stroke-width="22" stroke-linecap="round" fill="none"/>
  <g font-family="DM Sans, sans-serif" font-weight="600" font-size="38" fill="#D9BFA6">
    <text id="l1" x="170" y="320">Más camino</text><text id="l2" x="170" y="660">Camino medio</text><text id="l3" x="170" y="1000">Poco camino</text>
  </g>
</svg></div>

<div class="full" id="s7"><div class="box">
  <div class="k">Lexa Legal</div><div class="line"></div>
  <p>Lexa te orienta con una probabilidad. El resultado final sale de una búsqueda completa en la base oficial de marcas.</p>
  <div class="cta">Escribe NOMBRE por DM</div>
</div></div>
</body></html>
